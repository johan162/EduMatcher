<div class="diagram narrow">
<svg viewBox="0 0 520 380" role="img" aria-labelledby="cb-t" xmlns="http://www.w3.org/2000/svg">
  <title id="cb-t">Defence in depth: the gates an order passes before it can trade</title>
  <path id="gatepath" class="wire" d="M40 20 V360"/>
  <path class="flow" d="M40 20 V360"/>
  <g font-size="12.5">
    <g><rect x="80" y="12" width="420" height="58" rx="10" class="box"/><text class="t-acc" x="98" y="34" font-size="11" letter-spacing="1.5">1 · STATIC COLLAR</text><text class="t-strong" x="98" y="54">±20 % of reference — outside rejected</text></g>
    <g><rect x="80" y="82" width="420" height="58" rx="10" class="box"/><text class="t-acc" x="98" y="104" font-size="11" letter-spacing="1.5">2 · DYNAMIC COLLAR</text><text class="t-strong" x="98" y="124">band around the last trade price</text></g>
    <g><rect x="80" y="152" width="420" height="78" rx="10" class="box-acc"/><text class="t-acc" x="98" y="174" font-size="11" letter-spacing="1.5">3 · CIRCUIT BREAKERS</text><text class="t-strong" x="98" y="194">L1 7 % · L2 13 % · L3 20 %</text><text class="t-dim" x="98" y="214" font-size="11.5">the highest level crossed fires → halt</text></g>
    <g><rect x="80" y="242" width="420" height="58" rx="10" class="box"/><text class="t-acc" x="98" y="264" font-size="11" letter-spacing="1.5">4 · REOPENING AUCTION + ACE</text><text class="t-strong" x="98" y="284">collar widens until the call uncrosses</text></g>
    <g><rect x="80" y="312" width="420" height="58" rx="10" fill="color-mix(in srgb, var(--down) 14%, var(--surface-2))" stroke="var(--down)" stroke-width="1.4"/><text x="98" y="334" font-size="11" letter-spacing="1.5" fill="var(--down)">OPERATOR OVERRIDE</text><text class="t-strong" x="98" y="354">kill switch · mass cancel · admin halts</text></g>
  </g>
  <circle r="6.5" fill="var(--accent)"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#gatepath"/></animateMotion></circle>
  <circle r="15" fill="var(--accent)" opacity=".16"><animateMotion dur="6s" repeatCount="indefinite"><mpath href="#gatepath"/></animateMotion></circle>
</svg>
</div>
