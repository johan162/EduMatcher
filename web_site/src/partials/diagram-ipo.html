<div class="diagram">
<svg viewBox="0 0 1100 230" role="img" aria-labelledby="ipo-t" xmlns="http://www.w3.org/2000/svg">
  <title id="ipo-t">From a private company to its first trade: the eight steps pm-valuation and the exchange walk through</title>
  <!-- phase labels -->
  <g font-size="11" letter-spacing="2">
    <text class="t-acc" x="30" y="30">THE SCIENCE · VALUE THE COMPANY</text>
    <text x="558" y="30" fill="var(--amber)">THE BLACK MAGIC · SELL IT</text>
    <text x="822" y="30" fill="var(--up)">THE MARKET DECIDES</text>
  </g>
  <path d="M30 40 H544" stroke="var(--accent)" stroke-width="2"/>
  <path d="M558 40 H808" stroke="var(--amber)" stroke-width="2"/>
  <path d="M822 40 H1072" stroke="var(--up)" stroke-width="2"/>
  <path id="ipopath" class="wire" d="M30 125 H1072"/>
  <path class="flow slow" d="M30 125 H1072"/>
  <!-- steps -->
  <g font-size="12" text-anchor="middle">
    <rect x="30"  y="70" width="118" height="110" rx="10" class="box"/>
    <text class="t-acc" x="89" y="92" font-size="10.5" letter-spacing="1.5">1 · INTERVIEW</text>
    <text class="t-strong" x="89" y="122">12 pages</text><text class="t-dim" x="89" y="142" font-size="10.5">18 sector presets</text><text class="t-dim" x="89" y="158" font-size="10.5">4 levels</text>

    <rect x="162" y="70" width="118" height="110" rx="10" class="box"/>
    <text class="t-acc" x="221" y="92" font-size="10.5" letter-spacing="1.5">2 · FORECAST</text>
    <text class="t-strong" x="221" y="122">10 years</text><text class="t-dim" x="221" y="142" font-size="10.5">customers · churn</text><text class="t-dim" x="221" y="158" font-size="10.5">costs · FCFF</text>

    <rect x="294" y="70" width="118" height="110" rx="10" class="box-acc"/>
    <text class="t-acc" x="353" y="92" font-size="10.5" letter-spacing="1.5">3 · VALUE</text>
    <text class="t-strong" x="353" y="122">2-stage DCF</text><text class="t-dim" x="353" y="142" font-size="10.5">+ comparables</text><text class="t-dim" x="353" y="158" font-size="10.5">= fair value</text>

    <rect x="426" y="70" width="118" height="110" rx="10" class="box"/>
    <text class="t-acc" x="485" y="92" font-size="10.5" letter-spacing="1.5">4 · DOUBT IT</text>
    <text class="t-strong" x="485" y="122">bear · bull</text><text class="t-dim" x="485" y="142" font-size="10.5">tornado</text><text class="t-dim" x="485" y="158" font-size="10.5">Monte Carlo</text>

    <rect x="558" y="70" width="118" height="110" rx="10" fill="color-mix(in srgb, var(--amber) 14%, var(--surface-2))" stroke="var(--amber)" stroke-width="1.4"/>
    <text x="617" y="92" font-size="10.5" letter-spacing="1.5" fill="var(--amber)">5 · BOOK-BUILD</text>
    <text class="t-strong" x="617" y="122">price range</text><text class="t-dim" x="617" y="142" font-size="10.5">demand · hype</text><text class="t-dim" x="617" y="158" font-size="10.5">coverage</text>

    <rect x="690" y="70" width="118" height="110" rx="10" fill="color-mix(in srgb, var(--amber) 14%, var(--surface-2))" stroke="var(--amber)" stroke-width="1.4"/>
    <text x="749" y="92" font-size="10.5" letter-spacing="1.5" fill="var(--amber)">6 · VERDICT</text>
    <text class="t-strong" x="749" y="122">PROCEED</text><text class="t-dim" x="749" y="142" font-size="10.5">or POSTPONE</text><text class="t-dim" x="749" y="158" font-size="10.5">offer price · pop</text>

    <rect x="822" y="70" width="118" height="110" rx="10" fill="color-mix(in srgb, var(--up) 12%, var(--surface-2))" stroke="var(--up)" stroke-width="1.4"/>
    <text x="881" y="92" font-size="10.5" letter-spacing="1.5" fill="var(--up)">7 · LIST</text>
    <text class="t-strong" x="881" y="122">pm-new-symbol</text><text class="t-dim" x="881" y="142" font-size="10.5">reference price</text><text class="t-dim" x="881" y="158" font-size="10.5">seed quote</text>

    <rect x="954" y="70" width="118" height="110" rx="10" fill="color-mix(in srgb, var(--up) 12%, var(--surface-2))" stroke="var(--up)" stroke-width="1.4"/>
    <text x="1013" y="92" font-size="10.5" letter-spacing="1.5" fill="var(--up)">8 · THE OPEN</text>
    <text class="t-strong" x="1013" y="122">opening</text><text class="t-strong" x="1013" y="138">auction</text><text class="t-dim" x="1013" y="158" font-size="10.5">students' orders</text>
  </g>
  <text class="t-dim" x="551" y="212" font-size="11" text-anchor="middle">pm-valuation runs steps 1–6 without an exchange · --list hands the priced IPO straight to step 7</text>
  <circle r="6" fill="var(--accent)"><animateMotion dur="12s" repeatCount="indefinite"><mpath href="#ipopath"/></animateMotion></circle>
</svg>
</div>
