<svg viewBox="0 0 1100 540" role="img" aria-labelledby="arch-t arch-d" xmlns="http://www.w3.org/2000/svg">
  <title id="arch-t">EduMatcher process architecture</title>
  <desc id="arch-d">Clients connect through ALF, BALF and API gateways to the matching engine. The engine publishes every event on a ZeroMQ bus read by internal services and by external dissemination gateways.</desc>

  <!-- column captions -->
  <g class="t-dim" font-size="11" letter-spacing="2">
    <text x="100" y="14" text-anchor="middle">PARTICIPANTS</text><text x="320" y="14" text-anchor="middle">GATEWAYS</text>
    <text x="905" y="14" text-anchor="middle">THE BUS FANS OUT</text>
  </g>

  <!-- ===== wires (static) ===== -->
  <g class="wire">
    <path d="M190 73 H440 V150 H460"/>
    <path d="M190 158 H215 V130 H235"/><path d="M190 158 H215 V225 H235"/>
    <path d="M190 243 H215 V130 H235" opacity=".0"/><path d="M190 243 H215 V225 H235"/><path d="M190 243 H215 V320 H235"/>
    <path d="M190 328 H215 V320 H235"/>
    <path d="M405 125 H430 V170 H460"/><path d="M405 220 H460"/><path d="M405 315 H430 V270 H460"/>
    <path d="M550 76 V120"/><path d="M550 440 V400"/>
    <path d="M640 260 H668"/>
    <path d="M674 135 H720"/><path d="M674 385 H720"/>
    <path d="M190 413 H440 V330 H460"/>
  </g>

    <path class="flow slow" d="M550 440 V400"/>
    <path class="flow" d="M190 413 H440 V330 H460"/>
    <path class="flow rev" d="M668 260 H640"/>
    <path class="flow rev" d="M720 135 H674"/><path class="flow rev" d="M720 385 H674"/>
    <path class="flow rev slow" d="M460 190 H405"/><path class="flow rev slow" d="M460 245 H405" opacity="0"/>

  <g class="node" id="c2" data-link="g0 g1 g2"><rect class="box" x="10" y="210" width="180" height="66" rx="10"/><text class="t-strong" x="24" y="234" font-size="13">Your own programs</text><text class="t-dim" x="24" y="254" font-size="11">any language · TCP / HTTP</text></g>
  <g class="node" id="c3" data-link="g2"><rect class="box" x="10" y="295" width="180" height="66" rx="10"/><text class="t-strong" x="24" y="319" font-size="13">Browser apps</text><text class="t-dim" x="24" y="339" font-size="11">Trading GUI · TapeDeck</text></g>
  <g class="node" id="c4" data-link="eng"><rect class="box" x="10" y="380" width="180" height="66" rx="10"/><text class="t-strong" x="24" y="404" font-size="13">Operators</text><text class="t-dim" x="24" y="424" font-size="11">pm-admin · pm-opctl-cli</text></g>

  <g class="node" id="g0" data-link="eng c1 c2"><rect class="box" x="235" y="90" width="170" height="70" rx="10"/><text class="t-acc" x="250" y="114" font-size="12">ALF · text</text><text class="t-strong" x="250" y="134" font-size="13">pm-alf-gwy</text><text class="t-dim" x="250" y="150" font-size="11">TCP :5565</text></g>

    <text class="t-acc" x="475" y="146" font-size="11" letter-spacing="2">MATCHING ENGINE</text>
    <text class="t-strong" x="475" y="170" font-size="16">pm-engine</text>
    <g font-size="10.5"><text class="t-dim" x="475" y="192">PULL :5555 ◂ cmds</text><text class="t-dim" x="475" y="208">PUB  :5556 ▸ events</text><text class="t-dim" x="475" y="224">PUB  :5557 ▸ dropcopy</text></g>

    <g transform="translate(475 246)">
      <rect x="0" y="0" width="75" height="9" rx="2" fill="var(--up)" opacity=".25"/><rect x="25" y="14" width="50" height="9" rx="2" fill="var(--up)" opacity=".4"/><rect x="45" y="28" width="30" height="9" rx="2" fill="var(--up)" opacity=".65"/>
      <rect x="85" y="28" width="38" height="9" rx="2" fill="var(--down)" opacity=".65"/><rect x="85" y="14" width="56" height="9" rx="2" fill="var(--down)" opacity=".4"/><rect x="85" y="0" width="76" height="9" rx="2" fill="var(--down)" opacity=".25"/>

    <text class="t-dim" x="475" y="368" font-size="10">· sole socket binder</text>

  <!-- ===== bus ===== -->
  <rect x="666" y="36" width="10" height="460" rx="5" fill="var(--accent)" opacity=".85"/>
  <text x="0" y="0" transform="translate(693 270) rotate(90)" text-anchor="middle" font-size="10.5" letter-spacing="3" class="t-acc">ZEROMQ  PUB / SUB</text>

    <rect class="box" x="720" y="26" width="370" height="236" rx="14"/>

    <g font-size="12">
