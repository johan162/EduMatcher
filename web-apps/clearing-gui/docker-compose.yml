# Single-service deployment of pm-clearing-ui, the read-only clearing client.
#
#   docker compose up --build
#
# Then open http://localhost:8096. The static server serves the built web UI
# and proxies /api/* to pm-api-gwy on the same origin; pm-api-gwy is the only
# service the browser talks to. It reads clearing.db and eod.db itself
# (`clearing_db`, `eod_db` in its config): this container needs no database,
# volume or other address.
#
# The default target suits Docker Desktop. On Podman, or on Linux Docker
# without host-gateway support, export API_PROXY_TARGET before running
# compose (host.containers.internal on Podman).
services:
  clearing-gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-clearing-gui:latest
    ports:
      - "${CLEARING_GUI_PORT:-8096}:8096"
    environment:
      HOST: "0.0.0.0"
      PORT: "8096"
      # REST proxy target: the server's only connection.
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://host.docker.internal:8080}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8096/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
