# Single-service deployment of pm-dash, the operator dashboard.
#
#   make up        (or: podman-compose up --build / docker compose up --build)
#
# Then open http://localhost:8095. The Fastify bridge serves the built web UI
# and its WebSocket endpoint on the same port.
#
# Everything this container talks to runs outside this compose file:
# pm-monitor for the live health snapshot and events (ZeroMQ SUB to its PUB
# port, 5611), its metrics.db for history, and optionally pm-log-srv for
# operational logging. Point MONITOR_HOST/LOG_SRV_HOST at wherever those are
# reachable from inside the container (host.containers.internal on Podman),
# and mount the directory holding metrics.db (the backend's data directory)
# at /backend-data. pm-monitor binds 127.0.0.1 unless
# EDUMATCHER_GATEWAY_BIND_HOST (or monitor.bind_address) opens it.
#
# metrics.db is mounted read-only, so "the dashboard never writes to
# metrics.db" is enforced by the mount itself, not just by the code. The one
# writable volume is for the LALF failover log, written only when pm-log-srv
# is unreachable.
services:
  dash-gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-dash-gui:latest
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${WEB_PORT:-8095}:8095"
    environment:
      HOST: "0.0.0.0"
      PORT: "8095"
      # Restrict this to your site origin when exposed beyond localhost.
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_WS_CLIENTS: "${MAX_WS_CLIENTS:-200}"

      # pm-monitor's PUB socket, and the metrics.db it writes.
      MONITOR_HOST: "${MONITOR_HOST:-host.docker.internal}"
      MONITOR_PUB_PORT: "${MONITOR_PUB_PORT:-5611}"
      METRICS_DB_PATH: "/backend-data/metrics.db"
      # The deployed configuration: monitor.thresholds for /api/thresholds.
      CONFIG_ARTIFACT_PATH: "/backend-data/ref_data/engine_config.json"
      # The drawers' links into log-gui and book-gui, as the browser reaches
      # them (e.g. http://127.0.0.1:8091); empty: no links.
      LOG_GUI_URL: "${LOG_GUI_URL:-}"
      BOOK_GUI_URL: "${BOOK_GUI_URL:-}"

      # Operational logging. An unreachable pm-log-srv is a normal condition:
      # the bridge falls back to stdout at startup, or to LOG_FAILOVER_DIR if
      # the connection drops later.
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "${LOG_SRV_HOST:-host.docker.internal}"
      LOG_SRV_PORT: "${LOG_SRV_PORT:-5600}"
      LOG_FAILOVER_DIR: "/app/logs"
    volumes:
      # The backend's data directory (EDUMATCHER_DATA_DIR), read-only; :z lets
      # SELinux hosts read it.
      - "${EDUMATCHER_DATA_DIR:-./backend-data}:/backend-data:ro,z"
      # LALF failover log only — see the note above.
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8095/api/bridge/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
