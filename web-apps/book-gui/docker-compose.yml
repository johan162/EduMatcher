# Single-service deployment of pm-book, the web order book viewer.
#
#   make up        (or: podman-compose up --build / docker compose up --build)
#
# Then open http://localhost:8094. The Fastify bridge serves the built web UI
# and its WebSocket endpoint on the same port.
#
# Everything this container talks to runs outside this compose file:
# pm-api-gwy for live market data (WS /api/v1/market-data) and history
# (REST /api/v1/history/*), and optionally pm-log-srv for operational logging.
# Point API_GATEWAY_URL/LOG_SRV_HOST at wherever those are reachable from
# inside the container (host.containers.internal on Podman).
#
# There is no data volume: the bridge is stateless beyond in-memory session
# books. The one volume is for the LALF failover log, written only when
# pm-log-srv is unreachable.
services:
  book-gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-book-gui:latest
    ports:
      - "${BOOK_GUI_PORT:-8094}:8094"
    environment:
      HOST: "0.0.0.0"
      PORT: "8094"
      # Restrict this to your site origin when exposed beyond localhost.
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_WS_CLIENTS: "${MAX_WS_CLIENTS:-200}"

      # pm-api-gwy: live market data AND history both come from here, so the
      # key is required. It is read-only (gateway_id: null) and never reaches
      # the browser — supply it from the host environment rather than
      # committing it. Such a key is issued on the "dashboards" instance
      # (8081), not "desk" (8080), and is generated per engine configuration.
      API_GATEWAY_URL: "${API_GATEWAY_URL:-http://host.docker.internal:8081}"
      PM_BOOK_API_KEY: "${PM_BOOK_API_KEY:-}"

      # Operational logging. An unreachable pm-log-srv is a normal condition:
      # the bridge falls back to stdout at startup, or to LOG_FAILOVER_DIR if
      # the connection drops later.
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "${LOG_SRV_HOST:-host.docker.internal}"
      LOG_SRV_PORT: "${LOG_SRV_PORT:-5600}"
      LOG_FAILOVER_DIR: "/app/logs"
    volumes:
      # LALF failover log only — see the note above.
      - ./logs:/app/logs
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://127.0.0.1:8094/api/bridge/status'').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"',
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
