# Single-service deployment of pm-trading-ui.
#
#   docker compose up --build
#
# Then open http://localhost:8093. The static server serves the built web
# UI and proxies /api/* (REST + WebSocket upgrades) to pm-api-gwy on the
# same port.
#
# Everything this container talks to runs outside this compose file:
# pm-api-gwy for REST/WS trading and market data. CALF_* and LOG_SRV_*
# below are carried for parity with terminal-gui's compose file but are not
# read by apps/serve/serve.ts today — trader-gui has no direct CALF uplink
# or its own bridge process; it only proxies to pm-api-gwy.
#
# The defaults below target Docker Desktop. On Podman, or on Linux Docker
# without host-gateway support, export API_PROXY_TARGET (and CALF_HOST /
# LOG_SRV_HOST if needed later) before running compose (for example, use
# host.containers.internal on Podman).
#
# There is no volume mount: the static server holds no state of its own.
services:
  trader-gui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-trader-gui:latest
    ports:
      - "${TRADER_GUI_PORT:-8093}:8093"
    environment:
      HOST: "0.0.0.0"
      PORT: "8093"

      # REST + WebSocket proxy target — the server's only live connection.
      # "host.docker.internal" on Docker Desktop, or the actual host/container
      # name running pm-api-gwy.
      API_PROXY_TARGET: "${API_PROXY_TARGET:-http://host.docker.internal:8080}"

      # Not read by apps/serve/serve.ts yet — kept for parity with
      # terminal-gui in case trader-gui grows a direct CALF uplink or its
      # own bridge process later.
      CALF_HOST: "${CALF_HOST:-host.docker.internal}"
      CALF_PORT: "${CALF_PORT:-5570}"
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "${LOG_SRV_HOST:-host.docker.internal}"
      LOG_SRV_PORT: "${LOG_SRV_PORT:-5600}"
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "node -e \"fetch('http://127.0.0.1:8093/').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\"",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    restart: unless-stopped
