# pm-ai-swarm --swarm docs/examples/ref_data/s300-load-setup/swarm.yaml
# The design-limit swarm: AI001-AI500 at about 1 000 order actions per second.
version: 1
agents: {prefix: AI, start: 1, count: 500}
workers: 0            # 0 = min(cpus - 1, ceil(500 / 100))
budget: 1000          # order actions per second for the whole swarm
seed: 1000
symbols:
  per_agent: 10      # each symbol is traded by ~17 agents
composition:          # preset: weight; value-investor, institutional, news-trader need pm-market-sim
  noise-retail: 25
  value-investor: 22
  news-trader: 5
  institutional: 8
  scalper: 8
  trend-follower: 10
  contrarian: 10
  iceberg-seller: 4
  market-taker: 4
  block-taker: 2
  auction-player: 2
