# -- RALF post-trade gateway --
# RALF post-trade gateway settings
post_trade_gateway:
  name: ralf-gwy01
  bind_address: 0.0.0.0
  port: 5580
  replay_retention_sec: 900
  heartbeat_interval_sec: 1
  idle_timeout_sec: 5
  max_client_queue: 10000
  allowed_roles:
  - CLEARING
  - DROP_COPY
  - AUDIT

# -- CALF market-data gateway --
# CALF market-data gateway settings
market_data_gateway:
  enabled: true
  name: md-gwy01
  bind_address: 0.0.0.0
  port: 5570
  heartbeat_interval_sec: 1
  idle_timeout_sec: 5
  replay_window_sec: 30
  max_symbols_per_client: 300
  max_client_queue: 20000
  depth_levels: 10

# -- REST API gateways --
# REST/WebSocket API gateway process settings
api_gateways:
  desk:
    enabled: true
    host: 0.0.0.0
    port: 8080
    swagger_enabled: true
    log_level: info
    stats_db: data/stats.db
    order_retention_sec: 300
    credentials:
    - api_key: key-trader01-rwlr0v
      gateway_id: TRADER01
      description: Generated key for TRADER01
    - api_key: key-trader02-uzytnc
      gateway_id: TRADER02
      description: Generated key for TRADER02
    - api_key: key-trader03-rwqo7n
