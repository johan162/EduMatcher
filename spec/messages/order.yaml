# Canonical specification for the `order` message family.
#
# Scope (docs-design/EduMatcher-Message-Generator.md section 8):
#   Phase 4b - execution_report, the BALF binary frame.
#   Phase 5.1a - the five engine -> gateway order events below.
# The inbound commands (order.new, order.cancel, order.amend) and the
# combo/OCO topics are 5.1b/5.1c and are deliberately absent rather than
# half-specified.
#
# PRESENCE. These events are the reason section B.7.2 exists. They carry three
# kinds of field: always present; present but nullable; and absent entirely
# when unset. The last is `omit_when_none`, and it is used wherever the
# hand-written code omitted a key - which models/message.py::group_ids
# documents as deliberate: "an ordinary single order carries none of these,
# and its events should not grow four empty fields to say so".
#
# LAYOUT AUTHORITY. Every offset, size and enum value below comes from
# docs/user-guide/910-app-balf-protocol.md, which declares itself "the normative
# reference for BALF 1.0.0", and is cross-checked against
# src/edumatcher/balf_gwy/codec.py (the gateway that emits these frames) and
# tests/test_balf_gwy_unit.py (which asserts side at body offset 48).
#
# It deliberately does NOT follow docs/examples/balf/balf_parser.py, which was
# the source for this design's original example and is wrong: it models
# `order_id` as a 16-byte string where the protocol defines a u64, making it
# eight bytes too large on every message that carries one. See section 4.1's
# correction note.

family: order
version: 1

messages:
  - name: execution_report
    # BALF-only: a private per-order fill sent to the owning gateway session.
    # No `topic:` - this message never travels on the internal bus. It is NOT
    # the public trade.executed print; see section 4.6 and risk R13 on why the
    # two are separate messages rather than one message on two transports.
    transport: [balf]

    doc:
      motivation: >
        Private per-order fill notification, sent to the gateway session that
        owns the order. Both sides of a match receive their own report.
      since: "1.0"
      see_also: ["trade.executed"]
      example_note: >
        Sent for every partial or full fill, so a single order may produce
        several. remaining_qty reaching zero is what marks the order done;
        status FILLED says the same thing and the two must agree.

    fields:
      - name: client_order_id
        type: int
        required: true
        unit: dimensionless
        doc: Echoed from the original NEW_ORDER so a client can correlate.

      - name: order_id
        type: int
        required: true
        unit: dimensionless
        doc: >
          Session-scoped BALF order id assigned by the gateway. A u64 on the
          wire, not a string - this is the field the reference example got
          wrong.

      - name: fill_price
        type: float
        required: true
        unit: display_price
        doc: >
          Execution price in display money. On the wire it is an i64 scaled by
          the fixed BALF PRICE_SCALE of 10^8, never by the instrument's
          tick_decimals.
        validate: { gt: 0 }

      - name: fill_qty
        type: int
        required: true
        unit: shares
        doc: Quantity matched in this event, not cumulatively.
        validate: { gt: 0 }

      - name: remaining_qty
        type: int
        required: true
        unit: shares
        doc: Unfilled quantity after this fill; zero means the order is done.
        validate: { ge: 0 }

      - name: timestamp_ns
        type: int
        required: true
        unit: epoch_nanos
        doc: Trade time in nanoseconds since the Unix epoch.
        validate: { ge: 0 }

      - name: symbol
        type: string
        required: true
        doc: Instrument, echoed for convenience; matches the original order.
        validate: { max_len: 8, pattern: '^[A-Z0-9._]+$' }

      - name: side
        type: enum
        values: [BUY, SELL]
        required: true
        doc: Side of the filled order.

      - name: status
        type: enum
        values: [PARTIAL, FILLED]
        required: true
        doc: >
          Whether this fill completed the order. Only these two values exist on
          BALF - there is no NEW or CANCELLED execution report.

    encoding:
      balf:
        msg_type: 0x20
        # Total bytes on the wire = 8-byte header + 56-byte body. MUST equal
        # codec.FRAME_SIZE[0x20]; a test asserts it.
        frame_size: 64
        # Fixed for every BALF price. The 8-byte header (magic 0xBA,
        # version 0x01, msg_type, flags, seq_no u32 LE) is prepended by the
        # generator and must not appear in `layout`.
        price_scale: 100000000
        layout:
          - { field: client_order_id, repr: u64,     offset: 0 }
          - { field: order_id,        repr: u64,     offset: 8 }
          - { field: fill_price,      repr: i64,     offset: 16, scale: price_scale }
          - { field: fill_qty,        repr: u32,     offset: 24 }
          - { field: remaining_qty,   repr: u32,     offset: 28 }
          - { field: timestamp_ns,    repr: u64,     offset: 32 }
          - { field: symbol,          repr: "char[8]", offset: 40 }
          - { field: side,            repr: u8,      offset: 48, enum_map: { BUY: 1, SELL: 2 } }
          - { field: status,          repr: u8,      offset: 49, enum_map: { PARTIAL: 1, FILLED: 2 } }
          # "Must be zero" per the normative reference.
          - { reserved: 6, offset: 50 }

  # --------------------------------------------------------------------------
  # Phase 5.1a: engine -> gateway order events.
  #
  # All five share a parameterised topic keyed on the destination gateway, and
  # all five carry the group identifiers that tie an order to the structure it
  # belongs to (GROUP_ID_FIELDS in models/message.py).
  # --------------------------------------------------------------------------

  - name: order_ack
    topic: "order.ack.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: >
        Acknowledge acceptance or rejection of a new order, addressed to the
        gateway that submitted it.
      since: "1.0"
      see_also: ["order.fill.{GW_ID}", "order.new"]
      example_note: >
        The order-detail fields are present only when the engine had the order
        to hand; on a rejection before lookup they are absent. reason is empty
        on an acceptance.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: order_id, type: string, validate: { max_len: 64 } }
      - { name: accepted, type: bool }
      - { name: reason, type: string, required: false, default: "",
          doc: "Rejection detail; empty when accepted.", validate: { max_len: 256 } }
      - { name: symbol, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 16 } }
      - { name: side, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 8 } }
      - { name: order_type, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 16 } }
      - { name: tif, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 8 } }
      - { name: qty, type: int, required: false, nullable: true,
          omit_when_none: true, unit: shares }
      - { name: price, type: float, required: false, nullable: true,
          omit_when_none: true, unit: display_price,
          doc: "Absent for a MARKET order, which has no limit price." }
      - { name: client_tag, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: oco_group_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: combo_parent_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: quote_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: leg_index, type: int, required: false, nullable: true,
          omit_when_none: true, unit: dimensionless }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: order_fill
    topic: "order.fill.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: >
        Private fill notification for one order, addressed to the gateway that
        owns it. The public counterpart is trade.executed.
      since: "1.0"
      see_also: ["trade.executed"]
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: order_id, type: string, validate: { max_len: 64 } }
      - { name: fill_qty, type: int, unit: shares }
      - { name: fill_price, type: float, unit: display_price }
      - { name: remaining_qty, type: int, unit: shares }
      - { name: status, type: string, validate: { max_len: 16 } }
      - { name: symbol, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 16 } }
      - { name: side, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 8 } }
      - { name: order_type, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 16 } }
      - { name: tif, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 8 } }
      - { name: qty, type: int, required: false, nullable: true,
          omit_when_none: true, unit: shares }
      - { name: price, type: float, required: false, nullable: true,
          omit_when_none: true, unit: display_price }
      - { name: client_tag, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: oco_group_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: combo_parent_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: quote_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: leg_index, type: int, required: false, nullable: true,
          omit_when_none: true, unit: dimensionless }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: order_cancelled
    topic: "order.cancelled.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: "Confirm that a resting order has been cancelled."
      since: "1.0"
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: order_id, type: string, validate: { max_len: 64 } }
      - { name: client_tag, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: oco_group_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: combo_parent_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: quote_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: leg_index, type: int, required: false, nullable: true,
          omit_when_none: true, unit: dimensionless }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: order_expired
    topic: "order.expired.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: >
        A DAY order that never filled has expired at session end. Same shape as
        order.cancelled - the difference is who ended the order, not what the
        consumer needs to know about it.
      since: "1.0"
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: order_id, type: string, validate: { max_len: 64 } }
      - { name: client_tag, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: oco_group_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: combo_parent_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: quote_id, type: string, required: false, nullable: true,
          omit_when_none: true, validate: { max_len: 64 } }
      - { name: leg_index, type: int, required: false, nullable: true,
          omit_when_none: true, unit: dimensionless }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: order_amended
    topic: "order.amended.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: "Confirm an accepted amendment and report the resulting order."
      since: "1.0"
      example_note: >
        price is nullable but always present: a MARKET order has no limit
        price, and the field says so with null rather than by being absent.
        This is the one message in the group that emits null rather than
        omitting - it is what the hand-written builder did.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: order_id, type: string, validate: { max_len: 64 } }
      - { name: price, type: float, required: false, nullable: true,
          unit: display_price,
          doc: "New limit price, or null for an order that has none." }
      - { name: qty, type: int, unit: shares }
      - { name: remaining_qty, type: int, unit: shares }
      - { name: priority_reset, type: bool,
          doc: "True when the amendment lost the order its time priority." }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }
