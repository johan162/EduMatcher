# Canonical specification for the `trade` message family.
#
# Scope (see docs-design/EduMatcher-Message-Generator.md section 8): the bus
# projection (Phases 1-3) and the CALF projection (Phase 4a) are specified here.
# The RALF projection of trade.executed is real and documented in section 4.6 of
# the design, but its `encoding` block is deliberately NOT declared yet: nothing
# generates from it, and an unexercised spec block is an unexercised loader
# path. It arrives with the ralf_gateway adoption that consumes it.
#
# Field order below is authoritative and matches
# models/feed_schema.TradeExecutedPayload.to_dict() exactly. It deliberately
# does NOT match engine/main.py::_publish_trade, which emits `tick_decimals`
# between `price` and `quantity`; see section 12.3 of the design for why the
# hand-written call site does not get to dictate the canonical order.

family: trade
version: 1

messages:
  - name: trade_executed
    topic: "trade.executed"
    transport: [engine_pub, calf]

    doc:
      motivation: >
        Public print of a completed match. The authoritative record of what
        traded, consumed by statistics, clearing, index and market data.
      published_by: [engine]
      since: "1.0"
      see_also: ["book.{SYMBOL}", "order.fill.{GW_ID}"]
      example_note: >
        aggressor_side is AUCTION for uncross prints, where both sides rested
        and there is no true aggressor.

    fields:
      - name: id
        type: string
        required: true
        doc: >
          Durable, sortable trade id. The prefix is the persisted engine-run
          sequence and the suffix is the per-run trade counter.
        validate: { max_len: 64, pattern: '^\d{6}-\d{9}$' }

      - name: run_seq
        type: int
        required: false
        default: 0
        unit: dimensionless
        doc: >
          Durable engine-run sequence used as the trade id prefix. A change in
          run_seq marks an engine restart explicitly for consumers.
        validate: { ge: 0 }

      - name: symbol
        type: string
        required: true
        doc: Instrument the match occurred in.
        validate: { max_len: 16, pattern: '^[A-Z0-9._]+$' }

      - name: buy_order_id
        type: string
        required: true
        doc: Resting or aggressing order id on the buy side.
        validate: { max_len: 64 }

      - name: sell_order_id
        type: string
        required: true
        doc: Resting or aggressing order id on the sell side.
        validate: { max_len: 64 }

      - name: buy_gateway_id
        type: string
        required: true
        doc: Gateway that submitted the buy order.
        validate: { max_len: 32 }

      - name: sell_gateway_id
        type: string
        required: true
        doc: Gateway that submitted the sell order.
        validate: { max_len: 32 }

      - name: price
        type: float
        required: true
        unit: display_price
        doc: >
          Execution price in display money, already converted from ticks by
          the publisher. Contrast trade_log.price, which is ticks - the
          mismatch this `unit` declaration exists to make reviewable.
        validate: { gt: 0 }

      - name: quantity
        type: int
        required: true
        unit: shares
        doc: Matched quantity.
        validate: { gt: 0 }

      - name: aggressor_side
        type: enum
        values: [BUY, SELL, AUCTION]
        required: true
        # The contract is strict: the engine always publishes one of the three
        # values above (engine/order_book.py::_make_trade). The archive is not:
        # payloads written before the field existed carry nothing, and
        # feed_schema.py reads it as .get("aggressor_side", ""). parse_default
        # keeps from_dict able to read that history without making "" a legal
        # value - see section B.7.1 of the design.
        parse_default: ""
        doc: >
          Side that removed liquidity. AUCTION when both sides rested, which
          happens on an uncross print where there is no true aggressor.

      - name: timestamp
        type: float
        required: true
        unit: epoch_seconds
        doc: >
          Match time in Unix epoch seconds. The engine divides its nanosecond
          clock by 1e9 at publish time.

      - name: tick_decimals
        type: int
        required: false
        default: 2
        unit: dimensionless
        doc: Decimal scale for `price`; 1 tick = 10^-tick_decimals.
        validate: { ge: 0, le: 8 }

    encoding:
      engine_pub:
        # models/message.py::encode returns exactly TWO frames. The per-topic
        # sequence is a third frame added by SequencedPublisher.send_multipart
        # (messaging/bus.py) at publish time, never by make_*. Declaring it
        # here would double-stamp it.
        frames: [topic, json_payload]
        include: all

      calf:
        # Public market-data print on the CALF TRADE channel.
        # md_gateway/normaliser.py::normalise_trade emits ONLY these three keys;
        # CH/SYM/SEQ/TS are added by gateway.py::_emit_stream_event as the frame
        # envelope, not by the payload projection. The engine trade `id` is
        # deliberately absent from the public feed.
        #
        # gateway_injected is documentation only - the generated projection
        # never emits those keys, and their order here carries no meaning
        # (design section B.13, corrected in 1.8.0).
        msg_type: TRADE
        include: [price, quantity, aggressor_side]
        keys:
          price: PX
          quantity: QTY
          aggressor_side: SIDE
        gateway_injected: [CH, SYM, SEQ, TS]
