# Canonical specification for the `trade` message family.
#
# Phase 1 scope (see docs-design/EduMatcher-Message-Generator.md section 8):
# this file specifies the bus projection only, and only the Python binding is
# generated from it. The CALF and RALF projections of trade.executed are real
# and documented in section 4.6 of the design, but their `encoding` blocks are
# deliberately NOT declared here yet: nothing generates from them in Phase 1,
# and an unexercised spec block is an unexercised loader path. They arrive with
# the gateway adoption that consumes them.
#
# Field order below is authoritative and matches
# models/feed_schema.TradeExecutedPayload.to_dict() exactly. It deliberately
# does NOT match engine/main.py::_publish_trade, which emits `tick_decimals`
# between `price` and `quantity`; see section 12.3 of the design for why the
# hand-written call site does not get to dictate the canonical order.

family: trade
version: 1

messages:
  - name: trade_executed
    topic: "trade.executed"
    transport: [engine_pub]

    doc:
      motivation: >
        Public print of a completed match. The authoritative record of what
        traded, consumed by statistics, clearing, index and market data.
      since: "1.0"
      see_also: ["book.{SYMBOL}", "order.fill.{GW_ID}"]
      example_note: >
        aggressor_side is AUCTION for uncross prints, where both sides rested
        and there is no true aggressor.

    fields:
      - name: id
        type: string
        required: true
        doc: >
          Engine trade counter, unique **within one engine run only** - it
          restarts at 1 on every launch. Assigned by
          models/trade.py::Trade.create from a process-local itertools.count.
        validate: { max_len: 64, pattern: '^[0-9]+$' }

      - name: symbol
        type: string
        required: true
        doc: Instrument the match occurred in.
        validate: { max_len: 16, pattern: '^[A-Z0-9._]+$' }

      - name: buy_order_id
        type: string
        required: true
        doc: Resting or aggressing order id on the buy side.
        validate: { max_len: 64 }

      - name: sell_order_id
        type: string
        required: true
        doc: Resting or aggressing order id on the sell side.
        validate: { max_len: 64 }

      - name: buy_gateway_id
        type: string
        required: true
        doc: Gateway that submitted the buy order.
        validate: { max_len: 32 }

      - name: sell_gateway_id
        type: string
        required: true
        doc: Gateway that submitted the sell order.
        validate: { max_len: 32 }

      - name: price
        type: float
        required: true
        unit: display_price
        doc: >
          Execution price in display money, already converted from ticks by
          the publisher. Contrast trade_log.price, which is ticks - the
          mismatch this `unit` declaration exists to make reviewable.
        validate: { gt: 0 }

      - name: quantity
        type: int
        required: true
        unit: shares
        doc: Matched quantity.
        validate: { gt: 0 }

      - name: aggressor_side
        type: enum
        values: [BUY, SELL, AUCTION]
        required: true
        # The contract is strict: the engine always publishes one of the three
        # values above (engine/order_book.py::_make_trade). The archive is not:
        # payloads written before the field existed carry nothing, and
        # feed_schema.py reads it as .get("aggressor_side", ""). parse_default
        # keeps from_dict able to read that history without making "" a legal
        # value - see section B.7.1 of the design.
        parse_default: ""
        doc: >
          Side that removed liquidity. AUCTION when both sides rested, which
          happens on an uncross print where there is no true aggressor.

      - name: timestamp
        type: float
        required: true
        unit: epoch_seconds
        doc: >
          Match time in Unix epoch seconds. The engine divides its nanosecond
          clock by 1e9 at publish time.

      - name: tick_decimals
        type: int
        required: false
        default: 2
        unit: dimensionless
        doc: Decimal scale for `price`; 1 tick = 10^-tick_decimals.
        validate: { ge: 0, le: 8 }

    encoding:
      engine_pub:
        # models/message.py::encode returns exactly TWO frames. The per-topic
        # sequence is a third frame added by SequencedPublisher.send_multipart
        # (messaging/bus.py) at publish time, never by make_*. Declaring it
        # here would double-stamp it.
        frames: [topic, json_payload]
        include: all
