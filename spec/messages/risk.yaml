# Canonical specification for the `risk` message family.
#
# Phase 5.3a, part one of two: the three kill switches. `risk` is sixteen
# topics - eight submissions and eight acks - and splits cleanly by what the
# command acts on:
#
#   * this file, for now: cancelling a GATEWAY'S EXPOSURE, at three scopes.
#     risk.kill_switch (the caller's own), risk.kill_switch_gateway (one named
#     participant, ADMIN only) and risk.kill_switch_global (everyone).
#   * 5.3b: acting on INSTRUMENTS. symbol_halt, symbol_resume, cancel_symbol
#     and the two circuit-breaker sweeps.
#
# The two groups share nothing but gateway_id and reason, which is what makes
# them separately adoptable - there is no half-migrated state between the two
# sessions.
#
# NO NEW IDL CONSTRUCT, AND NONE NEEDED. Every optional field here is a
# single-key guard: `if note:`, `if command_id:`. That was established before
# the family was specified - design section 20.1 grepped all thirty of risk's
# guards while deciding whether DaySummary was the third paired-presence group
# or merely the third of many. It was the last one. No records, no lists, no
# variants: this family is regimes 1 and 4 throughout.
#
# ONE DELIBERATE ADDITION. risk.kill_switch grows a `note`. The engine's
# handler already read one and published it to the admin monitor, but the
# builder had no such parameter and none of the four producers sent one, so
# `kill_switch.self` was the single admin action whose note was always blank -
# see design section 22.2.

family: risk
version: 1

messages:
  - name: kill_switch
    topic: "risk.kill_switch"
    transport: [engine_pub]
    doc:
      motivation: >
        Gateway or admin to engine: cancel a gateway's open risk-bearing
        exposure. The gateway is NOT halted - it may submit again as soon as
        the ack arrives.
      since: "1.0"
      see_also: ["risk.kill_switch_ack.{GW_ID}", "risk.kill_switch_gateway"]
      example_note: >
        `symbol` scopes the cancel to one instrument. It is always emitted,
        as "" for the whole-gateway case, because the handler reads it as
        `if symbol_filter:` - empty and absent mean the same thing to it, and
        the hand-written builder always sent the key.

        `gateway_id` names whose exposure is cancelled, not who asked. This
        message only ever acts on the caller's own gateway; use
        risk.kill_switch_gateway for one participant acting on another.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: symbol, type: string, required: false, default: "",
          validate: { max_len: 16 },
          doc: 'Scope to one instrument; "" cancels across all of them.' }
      - { name: note, type: string, required: false, omit_when_empty: true,
          validate: { max_len: 256 },
          doc: "Free-text reason, recorded on the admin monitor." }
      - name: command_id
        type: string
        required: false
        omit_when_empty: true
        validate: { max_len: 64 }
        doc: >
          Echoed on the ack. A kill-switch ack carries no natural identifier -
          unlike the symbol acks, which carry `symbol` - so without this two
          concurrent mass cancels for one gateway are indistinguishable once
          both acks are in flight.
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: kill_switch_ack
    topic: "risk.kill_switch_ack.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: "Engine to caller: what the kill switch cancelled."
      since: "1.0"
      example_note: >
        The counters are always emitted, as 0 on rejection: the hand-written
        builder put them in the base payload beside `accepted`, and a rejected
        kill switch cancelled nothing. `reason` is likewise always present,
        as "" on success.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: accepted, type: bool }
      - { name: reason, type: string, required: false, default: "",
          validate: { max_len: 512 } }
      - { name: cancelled_orders, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: cancelled_quotes, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: command_id, type: string, required: false,
          omit_when_empty: true, validate: { max_len: 64 } }
    encoding:
      engine_pub: { frames: [topic, json_payload] }

  - name: kill_switch_gateway
    topic: "risk.kill_switch_gateway"
    transport: [engine_pub]
    doc:
      motivation: >
        ADMIN to engine: cancel every order and quote belonging to one named
        participant.
      since: "1.0"
      see_also: ["risk.kill_switch", "risk.kill_switch_global"]
      example_note: >
        The one message in this group where the caller and the affected
        gateway are allowed to differ. `gateway_id` is the ADMIN making the
        request - it is what the role and connection checks run against, and
        what addresses the ack - while `target_gateway_id` is whose exposure
        is cancelled. Two fields rather than one because they are two
        different participants, which is exactly what risk.kill_switch cannot
        express.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 },
          doc: "The ADMIN caller; the ack is addressed to this id." }
      - { name: target_gateway_id, type: string, validate: { max_len: 32 },
          doc: "Whose orders and quotes are cancelled." }
      - { name: note, type: string, required: false, omit_when_empty: true,
          validate: { max_len: 256 } }
      - { name: command_id, type: string, required: false,
          omit_when_empty: true, validate: { max_len: 64 } }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: kill_switch_gateway_ack
    topic: "risk.kill_switch_gateway_ack.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: "Engine to ADMIN: what the gateway-targeted kill switch cancelled."
      since: "1.0"
      example_note: >
        `target_gateway_id` is echoed in the body, unlike `gateway_id`, which
        the topic already carries. The two are different participants here, so
        an ack naming only the topic's id would not say who was actually
        acted on.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: accepted, type: bool }
      - { name: target_gateway_id, type: string, required: false, default: "",
          validate: { max_len: 32 } }
      - { name: reason, type: string, required: false, default: "",
          validate: { max_len: 512 } }
      - { name: cancelled_orders, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: cancelled_quotes, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: command_id, type: string, required: false,
          omit_when_empty: true, validate: { max_len: 64 } }
    encoding:
      engine_pub: { frames: [topic, json_payload] }

  - name: kill_switch_global
    topic: "risk.kill_switch_global"
    transport: [engine_pub]
    doc:
      motivation: >
        ADMIN to engine: cancel every resting order and quote, for every
        gateway. The full-market emergency stop.
      since: "1.0"
      see_also: ["risk.circuit_breaker_halt_all"]
      example_note: >
        Distinct from risk.circuit_breaker_halt_all, which halts trading but
        leaves resting orders in place. This one cancels them outright, and
        does not halt anything - a gateway may submit again immediately.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 },
          doc: "The ADMIN caller; the ack is addressed to this id." }
      - { name: note, type: string, required: false, omit_when_empty: true,
          validate: { max_len: 256 } }
      - { name: command_id, type: string, required: false,
          omit_when_empty: true, validate: { max_len: 64 } }
    encoding:
      engine_pub: { frames: [topic, json_payload], include: all }

  - name: kill_switch_global_ack
    topic: "risk.kill_switch_global_ack.{gateway_id}"
    transport: [engine_pub]
    doc:
      motivation: "Engine to ADMIN: what the market-wide kill switch cancelled."
      since: "1.0"
      example_note: >
        `affected_gateways` is what distinguishes this ack from the other two:
        the same two counters, plus how many participants they were spread
        across.
    fields:
      - { name: gateway_id, type: string, validate: { max_len: 32 } }
      - { name: accepted, type: bool }
      - { name: reason, type: string, required: false, default: "",
          validate: { max_len: 512 } }
      - { name: cancelled_orders, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: cancelled_quotes, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: affected_gateways, type: int, unit: dimensionless,
          required: false, default: 0, validate: { ge: 0 } }
      - { name: command_id, type: string, required: false,
          omit_when_empty: true, validate: { max_len: 64 } }
    encoding:
      engine_pub: { frames: [topic, json_payload] }
