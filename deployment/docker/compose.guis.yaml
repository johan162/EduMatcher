# Overlay: the five web GUIs that talk to the backend, in the same compose
# project as the exchange itself.
#
# Sharing one project is the whole trick. Compose puts every service on the
# project's default network, so the backend answers to the hostname
# "edumatcher" and every gateway port is reachable directly — all of them
# already bind 0.0.0.0 inside the container. Nothing has to be published to
# the host for this, and the ZMQ overlay is irrelevant here: pm-log-srv's
# LALF-PS sockets (5601/5602) bind 0.0.0.0 too. That also retires
# host.docker.internal / host-gateway / VM_BACKEND_IP, which is what made
# Podman and Linux Docker differ from Docker Desktop.
#
# Brought up by `make up-all`; config-gui lives in compose.config-gui.yaml
# because it needs no backend at all.
services:
  log-gui:
    build:
      context: ../../web-apps/log-gui
      dockerfile: Dockerfile
      args:
        # PyPI release of the bundled pm-log-cli when .wheel/ holds no wheel
        # (make build-guis PYPI=1 / VERSION=x.y.z); empty = the newest.
        EDUMATCHER_VERSION: ${EDUMATCHER_VERSION:-}
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-log-gui:latest
    container_name: ${CONTAINER_NAME:-edumatcher}-log-gui
    depends_on:
      - edumatcher
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${LOG_GUI_PORT:-8091}:8091"
    environment:
      HOST: "0.0.0.0"
      PORT: "8091"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      LOG_SRV_HOST: "edumatcher"
      LOG_SRV_PUB_PORT: "5601"
      LOG_SRV_PULL_PORT: "5602"
      LOG_DB_PATH: "/backend-data/log.db"
      ACK_STORE_PATH: "/app/ack-data/log-ui-acks.db"
    volumes:
      # pm-log-srv's own data directory — the same ./data the backend writes,
      # mounted read-only. The bridge opens log.db with { readOnly: true } and
      # pm-log-srv keeps the database in rollback-journal mode, so there is no
      # -wal/-shm write to fail on a read-only mount.
      - ./data:/backend-data:ro,z
      # This project's own ack store, read-write and persisted across restarts.
      - log-gui-acks:/app/ack-data

  terminal-gui:
    build:
      context: ../../web-apps/terminal-gui
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-terminal-gui:latest
    container_name: ${CONTAINER_NAME:-edumatcher}-terminal-gui
    depends_on:
      - edumatcher
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${TERMINAL_GUI_PORT:-8090}:8090"
    environment:
      HOST: "0.0.0.0"
      PORT: "8090"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_WS_CLIENTS: "${MAX_WS_CLIENTS:-200}"
      CALF_HOST: "edumatcher"
      CALF_PORT: "5570"
      CALF_CLIENT_ID: "${CALF_CLIENT_ID:-pm-terminal-bridge}"
      INDEX_IDS: "${INDEX_IDS:-}"
      # The read-only credential (gateway_id: null) is generated per engine
      # configuration and lives on the "dashboards" instance, not "desk", so
      # both the URL and the key are resolved from the deployed config by
      # `make up-all` rather than hardcoded here.
      API_GATEWAY_URL: "${API_GATEWAY_URL:-http://edumatcher:8081}"
      PM_TERMINAL_API_KEY: "${PM_TERMINAL_API_KEY:-}"
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "edumatcher"
      LOG_SRV_PORT: "5600"
      LOG_FAILOVER_DIR: "/app/logs"
    volumes:
      - terminal-gui-logs:/app/logs

  book-gui:
    build:
      context: ../../web-apps/book-gui
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-book-gui:latest
    container_name: ${CONTAINER_NAME:-edumatcher}-book-gui
    depends_on:
      - edumatcher
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${BOOK_GUI_PORT:-8094}:8094"
    environment:
      HOST: "0.0.0.0"
      PORT: "8094"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_WS_CLIENTS: "${MAX_WS_CLIENTS:-200}"
      # Live market data and history both come from pm-api-gwy, with the same
      # read-only credential terminal-gui uses — resolved from the deployed
      # config by `make up-all`. Without it the viewer has nothing to show.
      API_GATEWAY_URL: "${API_GATEWAY_URL:-http://edumatcher:8081}"
      PM_BOOK_API_KEY: "${PM_BOOK_API_KEY:-}"
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "edumatcher"
      LOG_SRV_PORT: "5600"
      LOG_FAILOVER_DIR: "/app/logs"
    volumes:
      - book-gui-logs:/app/logs

  dash-gui:
    build:
      context: ../../web-apps/dash-gui
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-dash-gui:latest
    container_name: ${CONTAINER_NAME:-edumatcher}-dash-gui
    depends_on:
      - edumatcher
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${DASH_GUI_PORT:-8095}:8095"
    environment:
      HOST: "0.0.0.0"
      PORT: "8095"
      CORS_ORIGIN: "${CORS_ORIGIN:-*}"
      MAX_WS_CLIENTS: "${MAX_WS_CLIENTS:-200}"
      # pm-monitor's snapshot feed. Not published to the host: it binds
      # 0.0.0.0 inside the backend (EDUMATCHER_GATEWAY_BIND_HOST) and is
      # reached over the compose network.
      MONITOR_HOST: "edumatcher"
      MONITOR_PUB_PORT: "5611"
      METRICS_DB_PATH: "/backend-data/metrics.db"
      # monitor.thresholds for the bands. Without it the bridge finds no
      # artifact and shows pm-monitor's default bands (I118).
      CONFIG_ARTIFACT_PATH: "/backend-data/ref_data/engine_config.json"
      # The drawers' links, as the browser reaches the sibling GUIs: set
      # LOG_GUI_URL / BOOK_GUI_URL in .env when that is not localhost.
      LOG_GUI_URL: "${LOG_GUI_URL:-http://localhost:${LOG_GUI_PORT:-8091}}"
      BOOK_GUI_URL: "${BOOK_GUI_URL:-http://localhost:${BOOK_GUI_PORT:-8094}}"
      LOG_SRV_ENABLED: "${LOG_SRV_ENABLED:-true}"
      LOG_SRV_HOST: "edumatcher"
      LOG_SRV_PORT: "5600"
      LOG_FAILOVER_DIR: "/app/logs"
    volumes:
      # The exchange's data directory, read-only: metrics.db and the deployed
      # configuration. The bridge opens metrics.db read-only, and reads it
      # immutable while pm-monitor is stopped and no -wal is left (I105).
      - ./data:/backend-data:ro,z
      - dash-gui-logs:/app/logs

  trader-gui:
    build:
      context: ../../web-apps/trader-gui
      dockerfile: Dockerfile
      args:
        NPM_STRICT_SSL:
        HTTP_PROXY:
        HTTPS_PROXY:
        NO_PROXY:
    image: edumatcher-trader-gui:latest
    container_name: ${CONTAINER_NAME:-edumatcher}-trader-gui
    depends_on:
      - edumatcher
    restart: unless-stopped
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${TRADER_GUI_PORT:-8093}:8093"
    environment:
      HOST: "0.0.0.0"
      PORT: "8093"
      # The desk instance: trading credentials are entered in the browser.
      API_PROXY_TARGET: "http://edumatcher:8080"

volumes:
  log-gui-acks:
  terminal-gui-logs:
  book-gui-logs:
  dash-gui-logs:
