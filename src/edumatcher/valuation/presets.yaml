# Sector presets for pm-valuation — docs-design/EduMatcher-valuation.md §5.
#
# Each preset is a coherent set of defaults for one business model. The values
# are illustrative and plausible, not researched benchmarks: edit them freely,
# or pass another file with --presets. Money is in the profile's currency,
# percentages are fractions (0.08 = 8%).

# SEC filer-status thresholds used on the S-1 cover (design §4). They change
# over time: EGC revenue as inflation-adjusted in 2022, SRC as defined in 2018.
filer_thresholds:
  egc_revenue: 1_235_000_000     # emerging growth company: revenue below this
  src_public_float: 250_000_000  # smaller reporting company: float below this,
  src_revenue: 100_000_000       # or revenue below this
  src_public_float_alt: 700_000_000  # and float below this

# Maximum reachable share of the SAM (p_max) for each market structure.
market_structures:
  fragmented: 0.05
  competitive: 0.08
  oligopoly: 0.15
  dominant: 0.30

