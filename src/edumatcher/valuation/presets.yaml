# S-1 cover, icb_code / icb_name on a Swedish prospectus cover. Each preset is
# tuned so that its all-defaults company is coherent in both markets (the
# test in tests/test_valuation_resolve.py). revenue_per_employee_band is the
# plausible year-N range for warning V020, in US dollars at US pay. Banks,
# insurers, property companies, pre-revenue biotech and exploration companies
# are valued in other ways (on equity, net asset value or reserves) and have
